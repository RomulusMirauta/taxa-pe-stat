# Publică site-ul pe GitHub Pages:
#   - la fiecare push pe main;
#   - în zilele lucrătoare, după ce BNR publică cursul: aduce datele noi (BNR, Eurostat),
#     le salvează în repo printr-un commit al lui github-actions[bot] și republică.
# Totul rulează pe serverele GitHub; calculatorul tău nu e implicat.
# O singură dată, în repo: Settings → Pages → Source: GitHub Actions.
#
# Un singur workflow face și datele, și publicarea: commit-urile făcute cu GITHUB_TOKEN
# nu pornesc alte workflow-uri, deci un job separat de date n-ar republica site-ul (FINDINGS F-32).
name: Publicare

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 11 * * 1-5'   # 13:30 ora României iarna, 14:30 vara (BNR publică în jur de 13:00)
    - cron: '30 15 * * 1-5'   # a doua încercare, dacă prima a întârziat sau a picat
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicare
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Date noi (BNR, Eurostat)
        if: github.event_name != 'push'
        run: node scripts/update-data.mjs
      - name: Salvează datele în repo
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/; then
            echo "Datele nu s-au schimbat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "date: curs $(node -p "require('./data/rates.json').fx.d1")"
          git pull --rebase
          git push
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
