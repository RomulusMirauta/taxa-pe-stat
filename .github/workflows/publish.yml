# Publishes the site to GitHub Pages:
#   - on every push to main;
#   - on weekdays, after BNR publishes the exchange rate: fetches the new data (BNR, Eurostat),
#     saves it to the repo in a commit by github-actions[bot] and republishes.
# Everything runs on GitHub's servers; your computer is not involved.
# One-time setup, in the repo: Settings → Pages → Source: GitHub Actions.
#
# A single workflow does both the data and the publishing: commits made with GITHUB_TOKEN
# do not trigger other workflows, so a separate data job would not republish the site (FINDINGS F-32).
name: Publish

on:
  push:
    branches: [main]
  # A scheduled time is a request: GitHub delays these runs, most of all at the start of the hour (F-88).
  # Observed on 29–30 Oct 2026: the runs set for 11:30 and 15:30 UTC started at 17:05–20:28 UTC, so the day's
  # BNR rate (published around 13:00 Romania time) reached the site at about 19:00. Hence three runs, off the
  # round minutes. The page's numbers do not depend on this, only how soon a new day's rate shows up.
  schedule:
    - cron: '17 11 * * 1-5'   # 13:17 Romania time in winter, 14:17 in summer
    - cron: '47 13 * * 1-5'   # 15:47 / 16:47: in case the first one was late or failed
    - cron: '23 16 * * 1-5'   # 18:23 / 19:23
  workflow_dispatch:

# Each job gets only what it needs (F-44).
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the data commit
      pages: read       # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@v6
        with:
          # The tip of main when the job starts, not the commit that triggered the run: otherwise a run
          # queued behind a data run would republish the previous data (F-43).
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Fetch new data (BNR, Eurostat)
        if: github.event_name != 'push'
        run: node scripts/update-data.mjs
      # The new data must pass the tests before it is committed: a commit that breaks them would block every later deploy (F-52).
      - name: Test the new data before committing it
        if: github.event_name != 'push'
        run: npm test
      - name: Commit the data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/; then
            echo "The data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: rates $(node -p "require('./data/rates.json').fx.d1")"
          git pull --rebase
          git push
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy-pages publishes the site
      id-token: write   # the OIDC token deploy-pages requires
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # After publishing: fails, so GitHub emails the owner, when the data has stopped updating,
  # without ever blocking the deploy (scripts/check-fresh.mjs, F-42, F-54).
  check:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check that the data is still being updated
        run: node scripts/check-fresh.mjs
